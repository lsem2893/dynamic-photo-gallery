<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Photo Gallery</h1>
  </header>

  <main>
    <div id="gallery" hidden></div>
    <div id="empty-state" hidden>
      <span class="empty-icon">🖼️</span>
      <p>Add photos to view here</p>
    </div>
  </main>

  <div id="lightbox" hidden aria-modal="true" role="dialog" aria-label="Photo lightbox">
    <button id="lb-close" aria-label="Close lightbox">&#x2715;</button>
    <button id="lb-prev" aria-label="Previous photo">&#x2039;</button>
    <div id="lb-content">
      <img id="lb-img" src="" alt="" />
      <p id="lb-caption"></p>
    </div>
    <button id="lb-next" aria-label="Next photo">&#x203A;</button>
  </div>

  
  <script src="app.js" defer></script>
</body>
</html>
